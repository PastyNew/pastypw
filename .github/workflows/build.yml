name: Build packages

# Builds every distributable format:
#   - Linux   : .deb, .rpm, .pkg.tar.zst, AppImage
#   - Windows : portable .exe + NSIS installer
#
# The Linux bundle is compiled inside Debian 12 so that the resulting
# binaries keep working on old glibc (Ubuntu 22.04+, Debian 12+, Fedora 35+).
#
# Artefacts are attached to the workflow run (Actions -> run -> Artifacts)
# and published on Releases for tags like v1.0.0.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.12'

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pytest
      - run: python -m pytest tests -q

  linux-packages:
    name: .deb + .rpm
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            dpkg-dev file fuse libglib2.0-0 libgl1 libegl1 libxkbcommon0 \
            libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-render-util0 libxcb-xinerama0 \
            libxcb-sync1 libxcb-randr0 libxcb-xfixes0 rpm
          pip install --no-cache-dir PySide6 pyinstaller pytest

      - name: Unit tests
        run: python -m pytest tests -q

      - name: Icons
        run: python scripts/make_icons.py

      - name: Screenshots for the README
        env:
          QT_QPA_PLATFORM: offscreen
          DISPLAY: ''
        run: python scripts/render_screenshots.py

      - name: Build frozen application
        run: |
          python -m PyInstaller packaging/pyinstaller/pastypw-linux.spec \
            --noconfirm --clean --distpath dist --workpath build/pyinstaller
          python scripts/slim_bundle.py

      - name: Build .deb
        run: python scripts/build_deb.py

      - name: Build .rpm
        run: ./scripts/build_rpm.sh

      - name: Collect packages
        run: |
          chmod -R a+rX dist
          mkdir -p out
          cp dist/*.deb dist/*.rpm out/ 2>/dev/null || true
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            out/*
            dist/pastypw/pastypw
            build/icons
          if-no-files-found: error
          retention-days: 7

  linux-extra:
    name: Arch package + AppImage
    runs-on: ubuntu-latest
    needs: linux-packages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: fetched

      - name: Restore the frozen application built on Debian 12
        run: |
          mkdir -p dist
          cp -a fetched/dist/pastypw dist/pastypw
          chmod +x dist/pastypw/pastypw
          ./dist/pastypw/pastypw --version || true

      # The AppImage and the Arch package need build/icons/pastypw-256.png.
      # This job has no PySide6, so the icons have to come from the artefact
      # instead of being regenerated by scripts/make_icons.py.
      - name: Restore icons from the linux-packages artefact
        run: |
          mkdir -p build/icons
          cp -a fetched/build/icons/. build/icons/
          ls -l build/icons/pastypw-256.png

      - name: Build AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends squashfs-tools
          ./scripts/build_appimage.sh

      - name: Build Arch package (.pkg.tar.zst)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman
          # makpkg refuses to run as root. keep-id maps the runner user to the
          # same uid inside the container, so the mounted workspace stays owned
          # by the runner; setpriv drops root only for the makpkg step.
          podman run --rm --userns=keep-id --user root -v "$PWD:/pkg" -w /pkg \
            docker.io/library/archlinux:base-devel \
            bash -lc "set -e; pacman -Syu --noconfirm --needed base-devel libarchive zstd >/dev/null; \
                      exec setpriv --reuid=$(id -u) --regid=$(id -g) --clear-groups \
                      env BUILDDIR=/tmp/pastypw-build PKGDEST=/tmp/pastypw-pkg \
                      ./scripts/build_arch_pkg.sh"

      - name: Collect artefacts
        run: |
          mkdir -p out
          find dist -maxdepth 1 \( -name '*.AppImage' -o -name '*.pkg.tar.zst' \) -exec cp {} out/ \;
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-extra
          path: out/*
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install PySide6 pyinstaller

      - name: Export icons
        run: |
          python scripts/make_icons.py
          python scripts/make_windows_icon.py

      - name: Build portable .exe
        shell: bash
        run: |
          python -m PyInstaller packaging/pyinstaller/pastypw-windows.spec \
            --noconfirm --clean --distpath dist --workpath build/pyinstaller

      - name: Build installer
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          # chocolatey deploys to 'C:\Program Files (x86)\NSIS' but the PATH of
          # the running PowerShell session is not refreshed, so point at it.
          $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { throw "makensis not found at $nsis" }
          & $nsis "-DpastypwExe=$PWD\dist\pastypw.exe" packaging\windows\installer.nsi

      - name: Collect artefacts
        run: New-Item -ItemType Directory -Force out | Out-Null; Copy-Item dist\*.exe out\ -Force; Get-ChildItem out

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: [test, linux-packages, linux-extra, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux-packages/*.deb
            artifacts/linux-packages/*.rpm
            artifacts/linux-extra/*.pkg.tar.zst
            artifacts/linux-extra/*.AppImage
            artifacts/windows/*.exe
          generate_release_notes: true
          body: |
            ## PastyNew Password Generator ${{ github.ref_name }}

            | Platform | File | Install |
            |---|---|---|
            | Ubuntu / Debian / Kali / Mint | `pastypw_*.deb` | `sudo dpkg -i pastypw_*.deb` |
            | Fedora / RHEL / openSUSE | `pastypw-*.rpm` | `sudo dnf install ./pastypw-*.rpm` |
            | Arch Linux / Kali | `pastypw-*.pkg.tar.zst` | `sudo pacman -U pastypw-*.pkg.tar.zst` |
            | Any Linux | `*.AppImage` | `chmod +x *.AppImage && ./pastypw-*.AppImage` |
            | Windows 10/11 | `PastyNew-PasswordGenerator-Setup-*.exe` | run the installer |
            | Windows (portable) | `pastypw.exe` | copy anywhere and run |

            Runs completely offline - no accounts, no telemetry, no network access.
            Generator created by **PastyNew**.