name: Feature request
description: Suggest a feature for the PastyNew password generator
title: "[feature] short description"
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation where the current generator is not enough.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What exactly should the generator be able to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I did not paste any real password into this request.
          required: true