[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pastypw"
version = "1.0.0"
description = "Offline password generator with a modern dark interface"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "PastyNew", email = "pastypew@gmail.com" }]
maintainers = [{ name = "PastyNew", email = "pastypew@gmail.com" }]
keywords = ["password", "generator", "security", "random", "qt", "pyside6"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Russian",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Utilities",
]
dependencies = ["PySide6>=6.5"]

[project.optional-dependencies]
dev = ["pyinstaller>=6.0", "pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/PastyNew/pastypw"
Source = "https://github.com/PastyNew/pastypw"
Issues = "https://github.com/PastyNew/pastypw/issues"

[project.gui-scripts]
pastypw = "pastypw.app:main"

[tool.setuptools]
packages = ["pastypw", "pastypw.core", "pastypw.ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"